version: '3.8'

services:
  # React Frontend (served by Nginx)
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - catan-network

  # Node.js Backend
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=https://catan.coolify.lan
      - DATA_DIR=/data
    volumes:
      - game-data:/data
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - catan-network

  # Redis for game state caching
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - catan-network

networks:
  catan-network:
    driver: bridge

volumes:
  redis-data:
  game-data:
